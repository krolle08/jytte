<title>Home Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky top bar, two views (Today grid / AI architecture list + sticky workflow inspector). Dark-first ops console. */
:root {
  --bg: #0d1214; --surface: #141b1e; --surface-2: #1a2327; --line: #243035;
  --fg: #e2e9ea; --muted: #8b9ca1; --accent: #5cc6d6; --accent-soft: #14323a;
  --good: #5fcf8b; --warn: #e6b04b; --crit: #ef6b63;
  --k-agent: #b69cf5; --k-skill: #5cc6d6; --k-trigger: #e6b04b; --k-tool: #8b9ca1; --k-gate: #ef8f63;
  --font-body: "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  --sp-bg: #060a14; --sp-fg: #e2e9ee; --sp-muted: #8d9bb5; --sp-line: #1d2a44;
  --c-analysis: #5cc6d6; --c-design: #b69cf5; --c-dev: #5fcf8b; --c-review: #ef8f63; --c-comm: #e6b04b; --c-ops: #8fa9ff;
  --cv-bg: #161920; --cv-dot: #2a2f3a; --cv-node: #272c36; --cv-nline: #3d4452; --cv-line: #7a8498; --cv-fg: #e0e6ef; --cv-muted: #8f99ab; --cv-loop: #5cc6d6;
  --nk-trigger: #e6b04b; --nk-agent: #b69cf5; --nk-skill: #5cc6d6; --nk-tool: #a3adbf; --nk-mcp: #ff7a66; --nk-model: #5fcf8b; --nk-memory: #7aa2ff; --nk-gate: #ef8f63; --nk-if: #d0dbe8;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f1f5f6; --surface: #ffffff; --surface-2: #e8eff1; --line: #d3dde0;
  --fg: #152024; --muted: #5b6e74; --accent: #0b7285; --accent-soft: #d6eef2;
  --good: #1f8a4c; --warn: #9a6a00; --crit: #c0392f;
  --k-agent: #6d4fc7; --k-skill: #0b7285; --k-trigger: #9a6a00; --k-tool: #5b6e74; --k-gate: #b4531f;
  color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #f1f5f6; --surface: #ffffff; --surface-2: #e8eff1; --line: #d3dde0;
  --fg: #152024; --muted: #5b6e74; --accent: #0b7285; --accent-soft: #d6eef2;
  --good: #1f8a4c; --warn: #9a6a00; --crit: #c0392f;
  --k-agent: #6d4fc7; --k-skill: #0b7285; --k-trigger: #9a6a00; --k-tool: #5b6e74; --k-gate: #b4531f;
  color-scheme: light; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45; padding-inline: 16px; padding-block: 0 100px; }
.wrap { max-width: 1280px; margin-inline: auto; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); }

header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); margin-inline: -16px; padding: 12px 16px; }
.bar { max-width: 1280px; margin-inline: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
.brand { font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 10px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
nav { display: flex; gap: 4px; }
nav button { background: none; border: 1px solid transparent; padding: 6px 12px; border-radius: 6px; color: var(--muted); }
nav button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.mock { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); padding: 3px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: .06em; }

main { padding-top: 20px; }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.stat .n { font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .l { color: var(--muted); font-size: 12px; margin-top: 2px; }
.stat.warn .n { color: var(--warn); } .stat.crit .n { color: var(--crit); }

.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-width: 0; display: flex; flex-direction: column; }
.c4 { grid-column: span 4; } .c6 { grid-column: span 6; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }
@media (max-width: 1000px) { .c4, .c6, .c8 { grid-column: span 12; } }
.ph { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }
.ph h2 { font-size: 13px; margin: 0; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.src { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-align: right; }
.pb { padding: 4px 0; }
.row { display: flex; gap: 10px; align-items: baseline; padding: 8px 14px; border-top: 1px solid var(--line); min-width: 0; }
.row:first-child { border-top: 0; }
.row .main { flex: 1; min-width: 0; }
.row .t { overflow-wrap: anywhere; }
.row .s { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.time { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; min-width: 44px; }
.pill { font-family: var(--font-mono); font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid currentColor; flex: none; white-space: nowrap; }
.good { color: var(--good); } .warn { color: var(--warn); } .crit { color: var(--crit); } .muted { color: var(--muted); }
.unread .t { font-weight: 600; }
.chk { display: flex; gap: 10px; align-items: flex-start; padding: 8px 14px; border-top: 1px solid var(--line); cursor: pointer; }
.chk:first-child { border-top: 0; }
.chk input { margin-top: 3px; accent-color: var(--accent); }
.chk input:checked + span { color: var(--muted); text-decoration: line-through; }
.tag { font-family: var(--font-mono); font-size: 11px; color: var(--accent); }

.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 12px 14px 14px; }
@media (max-width: 700px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.col h3 { margin: 0 0 8px; font-size: 12px; color: var(--muted); font-weight: 500; display: flex; justify-content: space-between; }
.card { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; font-size: 13px; overflow-wrap: anywhere; }
.card .id { font-family: var(--font-mono); font-size: 11px; color: var(--muted); display: block; }

/* AI architecture */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; align-items: center; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px; font-size: 13px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; }
@media (max-width: 1000px) { .split { grid-template-columns: minmax(0, 1fr); } }
.theme { margin-bottom: 20px; }
.theme > h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.proj { margin-bottom: 12px; }
.proj > h3 { font-size: 14px; margin: 0 0 6px; font-weight: 600; }
.wf { width: 100%; text-align: left; display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; margin-bottom: 6px; }
.wf:hover { border-color: var(--muted); }
.wf[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.wf .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.wf .meta { font-size: 12px; color: var(--muted); display: block; }
.eng { font-family: var(--font-mono); font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); color: var(--muted); flex: none; }

.detail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); max-height: calc(100vh - 80px); overflow: auto; }
@media (max-width: 1000px) { .detail { position: static; max-height: none; } }
.dh { padding: 14px 16px; border-bottom: 1px solid var(--line); }
.dh h2 { margin: 0 0 4px; font-size: 18px; font-weight: 600; overflow-wrap: anywhere; }
.dh p { margin: 4px 0 0; color: var(--muted); }
.dh .crumbs { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.steps { list-style: none; margin: 0; padding: 14px 16px 6px; }
.step { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; position: relative; padding-bottom: 14px; }
.step::before { content: ""; position: absolute; left: 13px; top: 28px; bottom: 0; width: 2px; background: var(--line); }
.step:last-child::before { display: none; }
.num { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--kc, var(--line)); display: grid; place-items: center; font-family: var(--font-mono); font-size: 12px; background: var(--surface); color: var(--kc, var(--fg)); }
.step .top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.kind { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--kc); }
.step .what { font-weight: 500; overflow-wrap: anywhere; }
.step .why { color: var(--muted); font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
.ref { display: inline-flex; gap: 6px; align-items: center; background: var(--surface-2); border: 1px solid var(--kc); border-radius: 5px; padding: 2px 8px; font-family: var(--font-mono); font-size: 12px; color: var(--kc); }
.ref:hover, .ref[aria-pressed="true"] { background: color-mix(in srgb, var(--kc) 18%, var(--surface)); }
.insp { margin: 4px 16px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); padding: 12px 14px; }
.insp h3 { margin: 0 0 2px; font-size: 14px; }
.insp .path { font-family: var(--font-mono); font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
.insp dl { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 6px 10px; margin: 10px 0 0; }
.insp dt { color: var(--muted); font-size: 12px; } .insp dd { margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.insp .empty { color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 0 16px 12px; font-family: var(--font-mono); font-size: 11px; }
.legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--kc); margin-right: 6px; }
.note { color: var(--muted); font-size: 12px; margin-top: 20px; }

/* Daily brief */
.acc { color: var(--accent); }
.brief .lead { padding: 14px 16px 2px; font-size: 18px; font-weight: 500; text-wrap: balance; }
.brief .date { padding: 12px 16px 0; font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.bcols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 16px; padding: 12px 16px 16px; }
.bcols h3 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.bcols ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.bcols li { overflow-wrap: anywhere; min-width: 0; }
.bcols .k { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-right: 6px; }

/* Mail importance */
.mhead { padding: 8px 14px 4px; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border-top: 1px solid var(--line); }
.mhead:first-child { border-top: 0; }
.cfg { border-top: 1px solid var(--line); padding: 10px 14px 12px; font-size: 13px; }
.cfg summary { cursor: pointer; color: var(--muted); }
.cfg label { display: block; color: var(--muted); font-size: 12px; margin: 12px 0 4px; }
.cfg input[type="text"] { background: var(--surface-2); border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 6px 10px; font: inherit; width: 100%; min-width: 0; }
.addrow { display: flex; gap: 8px; }
.btn { background: var(--accent-soft); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); border-radius: 6px; padding: 6px 14px; flex: none; }
.kws { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.kw { display: inline-flex; align-items: center; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; padding: 1px 4px 1px 10px; font-size: 13px; }
.kw button { background: none; border: 0; color: var(--muted); padding: 2px 6px; font-size: 15px; line-height: 1; }
.kw button:hover { color: var(--crit); }

/* Agent constellation (fixed dark space in both themes) */
.space { position: relative; overflow: hidden; border: 1px solid var(--sp-line); border-radius: 10px; margin-bottom: 24px; color: var(--sp-fg);
  background: radial-gradient(ellipse 60% 50% at 15% 0%, #15234a 0%, transparent 70%), radial-gradient(ellipse 50% 50% at 95% 100%, #22173f 0%, transparent 70%), var(--sp-bg); }
.stars { position: absolute; top: 0; left: 0; width: 1px; height: 1px; border-radius: 50%; pointer-events: none; }
.sh { position: relative; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; padding: 14px 16px 10px; }
.sh h2 { margin: 0; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
.sh span { font-family: var(--font-mono); font-size: 11px; color: var(--sp-muted); }
.systems { position: relative; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 12px; padding: 0 16px 16px; }
.sys { min-width: 0; border: 1px solid rgba(255,255,255,.08); border-radius: 8px; background: rgba(8,13,28,.6); padding: 10px 12px 6px; }
.sys h3 { margin: 0 0 4px; display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--pc); font-weight: 500; }
.sys h3 .cnt { color: var(--sp-muted); letter-spacing: 0; text-transform: none; }
.ag { display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 4px 10px; align-items: center; padding: 4px 0 8px; }
.ag + .ag { border-top: 1px solid rgba(255,255,255,.06); padding-top: 8px; }
.orb { position: relative; width: 108px; height: 108px; }
.ring { position: absolute; inset: 6px; border: 1px dashed rgba(255,255,255,.22); border-radius: 50%; animation: spin 90s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .ring { animation: none; } }
.planet { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; border: 0; padding: 0;
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--pc) 55%, #fff), var(--pc) 50%, color-mix(in srgb, var(--pc) 45%, #000)); }
.planet[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--sp-bg), 0 0 0 5px var(--sp-fg), 0 0 22px var(--pc); }
.planet[data-in="1"]:not([aria-pressed="true"]) { box-shadow: 0 0 0 3px var(--sp-bg), 0 0 0 5px var(--pc), 0 0 16px var(--pc); }
.moon { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 0; padding: 0;
  background: color-mix(in srgb, var(--pc) 45%, #fff); }
.moon::before { content: ""; position: absolute; inset: -8px; }
.moon[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--sp-bg), 0 0 0 4px var(--sp-fg), 0 0 12px var(--pc); }
.moon[data-in="1"]:not([aria-pressed="true"]) { box-shadow: 0 0 0 2px var(--sp-bg), 0 0 0 3px var(--pc), 0 0 10px var(--pc); }
.agt { min-width: 0; }
.an { background: none; border: 0; padding: 0; color: var(--sp-fg); font-weight: 600; font-size: 14px; text-align: left; overflow-wrap: anywhere; }
.an[aria-pressed="true"], .an:hover { color: var(--pc); }
.agt .d { color: var(--sp-muted); font-size: 12px; margin: 2px 0 6px; }
.sks { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.sk { background: none; border: 0; padding: 2px 0; font-family: var(--font-mono); font-size: 11px; color: var(--sp-fg); display: inline-flex; align-items: center; gap: 6px; overflow-wrap: anywhere; text-align: left; }
.sk::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: color-mix(in srgb, var(--pc, var(--sp-muted)) 45%, #fff); flex: none; }
.sk[aria-pressed="true"], .sk:hover { color: var(--pc, var(--sp-fg)); text-decoration: underline; }
.none { font-family: var(--font-mono); font-size: 11px; color: var(--sp-muted); }
.belt { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin: 0 16px 16px; padding: 10px 12px; border: 1px dashed rgba(255,255,255,.16); border-radius: 8px; }
.belt .bl { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--sp-muted); }
.scap { position: relative; border-top: 1px solid var(--sp-line); padding: 10px 16px; font-size: 13px; color: var(--sp-muted); background: rgba(6,10,20,.6); }
.scap b { color: var(--sp-fg); font-weight: 600; }
.sec { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 10px; }
.wf .pill.acc { font-size: 11px; }

/* Links in rows */
a.row { color: inherit; text-decoration: none; }
a.row:hover { background: var(--surface-2); }
.rt { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex: none; }
.open { font-family: var(--font-mono); font-size: 11px; color: var(--accent); white-space: nowrap; }
.open.teams { color: var(--k-agent); }

/* n8n style flow canvas (dark in both themes) */
.dtop { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.zoom { display: flex; gap: 4px; }
.zoom button { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; min-width: 34px; height: 30px; padding: 0 8px; color: var(--fg); }
.cvs { overflow-x: auto; background-color: var(--cv-bg); background-image: radial-gradient(circle, var(--cv-dot) 1px, transparent 1.3px); background-size: 20px 20px; }
.cvbox { position: relative; }
.cvi { position: absolute; left: 0; top: 0; transform-origin: 0 0; color: var(--cv-fg); }
.cvsvg { position: absolute; left: 0; top: 0; overflow: visible; }
.e { fill: none; stroke: var(--cv-line); stroke-width: 1.6; stroke-linejoin: round; }
.e.sub { stroke-dasharray: 4 4; stroke-width: 1.4; }
.e.loop { stroke: var(--cv-loop); }
.elab { font-family: var(--font-mono); font-size: 10px; fill: var(--cv-muted); }
.elab.loop { fill: var(--cv-loop); }
.nd { position: absolute; display: flex; align-items: center; justify-content: center; background: var(--cv-node); border: 1.5px solid var(--cv-nline); border-radius: 12px; padding: 0; color: var(--cv-fg); }
.nd:hover { border-color: var(--cv-line); }
.nd[aria-pressed="true"] { border-color: var(--cv-fg); box-shadow: 0 0 0 3px color-mix(in srgb, var(--cv-fg) 24%, transparent); }
.nd.sub { border-radius: 50%; }
.nd.agent { justify-content: flex-start; gap: 8px; padding: 0 10px; text-align: left; }
.nd .ic { display: grid; place-items: center; flex: none; }
.ag2 { font-size: 11px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; min-width: 0; }
.nl, .nt, .pl { position: absolute; text-align: center; color: var(--cv-fg); font-size: 11px; line-height: 1.2; pointer-events: none; }
.nl.s { font-size: 9.5px; color: var(--cv-muted); line-height: 1.15; }
.nt { transform: translateY(-100%); color: var(--cv-muted); font-size: 10.5px; text-align: left; }
.pl { transform: translateX(-50%); font-size: 9px; color: var(--cv-muted); font-family: var(--font-mono); white-space: nowrap; }
.cvleg { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 10px 16px; background: var(--cv-bg); border-top: 1px solid #262b35; color: var(--cv-muted); font-family: var(--font-mono); font-size: 11px; }
.cvleg span { display: inline-flex; align-items: center; gap: 6px; }

/* Voice */
#voice { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 30; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; max-width: calc(100vw - 32px); }
.mic { width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--accent); color: var(--bg); display: grid; place-items: center; box-shadow: 0 4px 16px rgba(0,0,0,.35); }
.mic.on { background: var(--crit); color: #fff; animation: pulse 1.4s ease-in-out infinite; }

  if (t) { var z = S.zoomShown || 1, d = t.dataset.zoom; S.zoom = d === "fit" ? null : Math.max(0.5, Math.min(1.5, z + (d === "in" ? 0.1 : -0.1))); fitCanvas(); return; }
  t = e.target.closest("[data-ref]");
  if (t) { var same = S.ref && S.ref.id === t.dataset.ref && S.ref.type === t.dataset.type; S.ref = same ? null : { type: t.dataset.type, id: t.dataset.ref }; S.node = null; applyAll(); return; }
  t = e.target.closest("[data-wf],[data-goto]");
  if (t) { S.wf = t.dataset.wf || t.dataset.goto; S.node = null; if (t.dataset.wf) S.ref = null; applyAll(true); if (innerWidth <= 1000) $("#detail").scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  t = e.target.closest("[data-theme-f]");
  if (t) { S.theme = t.dataset.themeF; $("#filters").innerHTML = filtersHTML(); $("#wflist").innerHTML = listHTML(); }
});

/* ---------- VOICE COMMANDS ---------- */
var V = { sample: null, busy: false, rec: null, tools: false, failed: false };
function refresh() { S.view === "today" ? renderToday() : renderAI(); }
var ACTIONS = {
  show_view: { d: "Switch the dashboard to the Today view or the AI architecture view.", p: { view: { type: "string", enum: ["today", "ai"] } },
    f: function (a) { if (a.view !== "today" && a.view !== "ai") throw new Error("view must be today or ai"); show(a.view); return "Showing " + a.view; } },
  open_workflow: { d: "Open a workflow by id in the AI architecture view and show its flow.", p: { id: { type: "string" } },
    f: function (a) { if (!WF[a.id]) throw new Error("Unknown workflow id " + a.id); S.wf = a.id; S.ref = null; S.node = null; S.theme = "all"; show("ai"); return "Opened workflow " + WF[a.id].n; } },
  select_agent_or_skill: { d: "Highlight an agent or a skill by id in the AI architecture view and show where it is used.", p: { id: { type: "string" } },
    f: function (a) { var t = AGENTS[a.id] ? "agent" : (SKILLS[a.id] ? "skill" : null); if (!t) throw new Error("Unknown agent or skill " + a.id); S.ref = { type: t, id: a.id }; S.node = null; show("ai"); return "Selected " + t + " " + a.id; } },
  add_mail_keyword: { d: "Add a keyword (a person or a word) that marks mail as important when it appears in the sender or title.", p: { word: { type: "string" } },
    f: function (a) { var v = String(a.word || "").trim(); if (!v) throw new Error("Empty keyword"); if (!S.kw.some(function (k) { return k.toLowerCase() === v.toLowerCase(); })) { S.kw.push(v); savePrefs(); } S.cfgOpen = true; if (S.view !== "today") show("today"); else renderToday(); return "Added keyword " + v; } },
  remove_mail_keyword: { d: "Remove a mail importance keyword.", p: { word: { type: "string" } },
    f: function (a) { var v = String(a.word || "").toLowerCase(); var n = S.kw.length; S.kw = S.kw.filter(function (k) { return k.toLowerCase() !== v; }); if (S.kw.length === n) throw new Error("No such keyword"); savePrefs(); if (S.view === "today") renderToday(); return "Removed keyword " + a.word; } },
  add_task: { d: "Add a task to the vault task list.", p: { text: { type: "string" } },
    f: function (a) { var v = String(a.text || "").trim(); if (!v) throw new Error("Empty task"); D.tasks.unshift({ d: v, f: "Inbox.md", done: 0 }); if (S.view !== "today") show("today"); else renderToday(); return "Added task " + v; } },
  set_task_done: { d: "Mark a vault task done or open again, by its index in the task list.", p: { index: { type: "number" }, done: { type: "boolean" } },
    f: function (a) { var t = D.tasks[Number(a.index)]; if (!t) throw new Error("No task at that index"); t.done = a.done ? 1 : 0; if (S.view !== "today") show("today"); else renderToday(); return (t.done ? "Completed " : "Reopened ") + t.d; } }
};
function stateJSON() {
  return JSON.stringify({ view: S.view, openWorkflow: S.wf,
    workflows: Object.keys(WF).map(function (k) { return { id: k, name: WF[k].n, project: projOf(k).p }; }),
    agents: Object.keys(AGENTS).map(function (a) { return { id: a, category: AGENTS[a].cat }; }), skills: Object.keys(SKILLS),
    mailKeywords: S.kw, tasks: D.tasks.map(function (t, i) { return { index: i, text: t.d, done: !!t.done }; }) });
}
function buildTools(acted) {
  return Object.keys(ACTIONS).map(function (k) {
    return { name: k, description: ACTIONS[k].d, inputSchema: { type: "object", properties: ACTIONS[k].p, required: Object.keys(ACTIONS[k].p) },
      execute: function (a) { var r = ACTIONS[k].f(a || {}); acted.push(r); return r; } };
  });
}
var INTRO = "You operate a personal dashboard on behalf of the user. The user spoke or typed a command; speech recognition may have garbled it, and it may be Danish or English. " +
  "Carry it out with the tools. If it is only a question or nothing matches, do not call a tool. Finish with one short sentence in the user's language saying what you did or why you could not.\n\nDashboard state:\n" ;
function vlog(cls, text) {
  var d = document.createElement("div"); d.className = "vl " + cls; d.textContent = text;
  var l = $("#vlog"); l.appendChild(d); while (l.children.length > 8) l.removeChild(l.firstChild); l.scrollTop = l.scrollHeight;
}
function vstatus(t) { $("#vstatus").textContent = t; }
function errCopy(c) {
  return { not_granted: "Claude access was declined for this page.", sampling_disabled: "Claude is not available for this account.", rate_limited: "Too many requests. Try again in a minute.", session_expired: "Sign in again to continue." }[c] || "Could not reach Claude. Try again.";
}
async function sendCommand(text) {
  if (V.busy || !V.sample) return;
  V.busy = true; vlog("me", text); vstatus("Thinking..."); $("#vsend").disabled = true;
  var acted = [];
  try {
    if (V.tools) {
      var res = await V.sample(INTRO + stateJSON() + '\n\nCommand: "' + text + '"', { modelTier: "quick", tools: buildTools(acted) });
      vlog("ai", res.text);
    } else {
      var out = await V.sample.json(INTRO.replace("with the tools", "by listing actions") + stateJSON() + "\n\nAvailable actions: " + JSON.stringify(Object.keys(ACTIONS).map(function (k) { return { name: k, does: ACTIONS[k].d, args: Object.keys(ACTIONS[k].p) }; })) +
        '\n\nReply with only JSON: {"actions":[{"name":string,"args":object}],"reply":string}\n\nCommand: "' + text + '"', { modelTier: "quick" });
      (out.actions || []).forEach(function (a) { try { if (ACTIONS[a.name]) ACTIONS[a.name].f(a.args || {}); } catch (e) { } });
      vlog("ai", out.reply || "Done.");
    }
  } catch (e) { if (e && e.code !== "cancelled") vlog("err", errCopy(e && e.code)); }
  finally { V.busy = false; vstatus(""); $("#vsend").disabled = false; $("#vinput").value = ""; }
}
function stopListening() { if (V.rec) { try { V.rec.stop(); } catch (e) { } } }
function startListening() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition, mic = $("#mic");
  var fallback = function (m) { V.rec = null; mic.classList.remove("on"); vstatus(m); $("#vinput").focus(); };
  if (!SR) { fallback("No speech recognition here. Use your keyboard's dictation key."); return; }
  try {
    var r = new SR(), heard = ""; V.failed = false;
    r.lang = $("#vlang").value; r.interimResults = true; r.continuous = false;
    r.onresult = function (e) { var t = ""; for (var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript; heard = t; $("#vinput").value = t; };
    r.onerror = function (e) { V.failed = true; fallback(e.error === "not-allowed" || e.error === "service-not-allowed" ? "Microphone is blocked in this view. Use your keyboard's dictation key." : "Speech error: " + e.error); };
    r.onend = function () { V.rec = null; mic.classList.remove("on"); if (!V.failed && heard.trim()) sendCommand(heard.trim()); else if (!V.failed) vstatus("Heard nothing."); };
    V.rec = r; r.start(); mic.classList.add("on"); vstatus("Listening...");
  } catch (e) { fallback("Speech recognition failed to start. Type or dictate instead."); }
}
$("#mic").addEventListener("click", function () {
  var sheet = $("#vsheet");
  if (V.rec) { stopListening(); return; }
  if (sheet.hidden) { sheet.hidden = false; $("#mic").setAttribute("aria-expanded", "true"); startListening(); }
  else { sheet.hidden = true; $("#mic").setAttribute("aria-expanded", "false"); }
});
$("#vform").addEventListener("submit", function (e) { e.preventDefault(); var v = $("#vinput").value.trim(); if (v) sendCommand(v); });
$("#vclose").addEventListener("click", function () { stopListening(); $("#vsheet").hidden = true; $("#mic").setAttribute("aria-expanded", "false"); });
(function () {
  var p = (window.claude && window.claude.use) ? window.claude.use("sample") : Promise.resolve(null);
  p.then(function (s) {
    if (!s) return;
    V.sample = s; $("#voice").hidden = false;
    if (s.limits) s.limits().then(function (l) { V.tools = !!(l && l.tools); }).catch(function () { });
  }).catch(function () { });
})();

/* ---------- NAV ---------- */
function show(v) {
  S.view = v;
  $("#nav-today").setAttribute("aria-pressed", v === "today");
  $("#nav-ai").setAttribute("aria-pressed", v === "ai");
  v === "today" ? renderToday() : renderAI();
  window.scrollTo(0, 0);
}
$("#nav-today").addEventListener("click", function () { show("today"); });
$("#nav-ai").addEventListener("click", function () { show("ai"); });
loadPrefs();
show("today");
