# Cloudflare tunnel for the bank consent callback, and nothing else.
#
# Jytte has no login. A tunnel pointed at the whole app would publish
# the dashboard - balances, salary, tasks, calendar - to anyone who
# guesses the hostname. So the ingress list below answers exactly one
# path and 404s the rest, and that rule is enforced here, in a
# committed file, rather than in a dashboard setting nobody reviews.
#
# This is config-file mode on purpose. The token form of cloudflared
# ("tunnel run --token") ignores this file and takes its routing from
# the Cloudflare dashboard, which would move the one security control
# in this setup out of the repository.
#
# ---------------------------------------------------------------------
# What you do, once (an agent must not do any of it):
#
#   1. cloudflared tunnel login
#   2. cloudflared tunnel create jytte
#      -> writes ~/.cloudflared/<UUID>.json and prints the UUID
#   3. cloudflared tunnel route dns jytte jytte.<your domain>
#   4. Put the UUID in .env as CLOUDFLARE_TUNNEL_ID, and copy
#      <UUID>.json to deploy/cloudflared/credentials.json (gitignored)
#   5. Replace the hostname below with the one from step 3
#   6. docker compose --profile tunnel up -d cloudflared
#
# Then register https://jytte.<your domain>/bank/callback as the
# allowed redirect URL with the AIS provider.
# ---------------------------------------------------------------------

# The tunnel id is NOT set here. cloudflared does not expand
# environment variables in this file, and hard-coding the id would put
# it in git. docker-compose passes it on the command line instead,
# where ${CLOUDFLARE_TUNNEL_ID} does expand, out of .env.
credentials-file: /etc/cloudflared/credentials.json

# No automatic DNS edits from inside the container.
no-autoupdate: true

ingress:
  # The one path the internet may reach. `path` is a regular expression
  # anchored at the start, so this matches /bank/callback and its query
  # string and nothing above it.
  - hostname: jytte.CHANGEME.dk
    path: ^/bank/callback$
    service: http://jytte:8080

  # Everything else, including / and /bank itself, is not published.
  - service: http_status:404
