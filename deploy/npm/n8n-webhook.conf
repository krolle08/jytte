# Nginx Proxy Manager: the Advanced tab of the proxy host for the public
# n8n hostname. Paste everything below this header block.
#
# Proxy host, Details tab:
#   Domain Names     n8n.<your domain>
#   Scheme / Host    http / n8n        (NPM and n8n share the traefik network)
#   Port             5678
#   Websockets, cache, block exploits: off
#
# Why only /webhook/: the n8n editor holds every credential this setup
# has. It stays on Tailscale (http://server:5678) and is never public.
# Left closed on purpose:
#   /webhook-test/  editor test listeners, only useful from the editor
#   /form/          n8n forms, none in deploy/n8n/workflows
#   /rest/, /       the editor and its API
#
# Set WEBHOOK_URL=https://n8n.<your domain>/ in the server's .env, or
# n8n prints webhook URLs with localhost:5678 in them.
#
# NPM leaves out its own `location /` when the advanced config contains
# one, so the 404 below replaces it. Check after saving:
#   docker exec nginx-proxy-manager nginx -t

location ^~ /webhook/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 16m;
    proxy_pass http://n8n:5678;
}

location / {
    return 404;
}
