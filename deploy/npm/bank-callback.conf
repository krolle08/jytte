# Nginx Proxy Manager: the Advanced tab of the proxy host for the public
# Jytte hostname. Paste everything below this header block.
#
# Proxy host, Details tab:
#   Domain Names     jytte.<your domain>
#   Scheme / Host    http / jytte      (NPM and Jytte share the traefik network)
#   Port             8080
#   Websockets, cache, block exploits: off
#
# Why this file exists: Jytte has no login. A plain NPM proxy host
# forwards every path, which would publish balances, salary and tasks.
# The two locations below answer /bank/callback and 404 everything else,
# the same rule deploy/cloudflared/config.yml enforced.
#
# NPM leaves out its own `location /` when the advanced config contains
# one, so the 404 below replaces it. Check after saving:
#   docker exec nginx-proxy-manager nginx -t
#
# access_log off: the consent `code` is in the query string and NPM's
# per-host access log prints the full request line. Same rule as
# bankauth.install_log_filter() applies to uvicorn.

location = /bank/callback {
    access_log off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://jytte:8080;
}

location / {
    return 404;
}
