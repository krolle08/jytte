apiVersion: v1
kind: Secret
metadata:
  name: jytte-secrets
  namespace: jytte
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE_ME"
  ACLED_KEY: ""
  ACLED_EMAIL: ""
  # Azure DevOps widget (F4). PAT scopes: Code: Read, Build: Read, Work Items: Read
  AZDO_ORG: "REPLACE_ME"
  AZDO_PROJECT: "REPLACE_ME"
  AZDO_PAT: "REPLACE_ME"
  AZDO_USER_EMAIL: "REPLACE_ME"
  AZDO_TEAM: ""
  # F5 - n8n integration substrate
  JYTTE_INTERNAL_SECRET: "REPLACE_ME_WITH_token_urlsafe(48)"
  JYTTE_AUTO_RESTART_N8N: "false"
