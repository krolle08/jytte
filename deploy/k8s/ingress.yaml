apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jytte
  namespace: jytte
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: jytte.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jytte
                port:
                  number: 80
