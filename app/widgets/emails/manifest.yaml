name: emails
title: Emails
# source: n8n (FEAT-009). Mail is fetched by the user's n8n workflow (which
# holds all mailbox credentials: Trustworks + Dagrofa via Microsoft Graph,
# personal Gmail) and PUSHED to POST /widgets/emails/state. Never scheduled
# locally; the /state anti-clobber guard accepts it because source is n8n.
source: n8n
refresh_minutes: null
client_refresh_seconds: 120
claude_analyzer: false
expose_mcp: true
watcher: false
