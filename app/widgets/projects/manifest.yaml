name: projects
site: local
title: Projects
# Vault files change rarely and only when the user edits Obsidian, so a
# 15-minute poll is plenty. No watcher: unlike `tasks`, the LLM-Wiki
# mount is read-only and much larger, and a recursive observer over ten
# sub-wikis would cost more than it saves.
refresh_minutes: 15
client_refresh_seconds: 300
claude_analyzer: false
expose_mcp: false
watcher: false
# Real surface is its own page, so no card on /dashboard.
page_only: true
