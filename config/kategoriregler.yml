# Regler: fra posteringstekst til kategori.
#
# HVORDAN DET VIRKER
# Hver postering proeves mod reglerne OPPEFRA OG NED, og den foerste
# der rammer vinder. Derfor staar det specifikke oeverst og det brede
# nederst: "circle k" skal ramme braendstof foer "k" rammer noget som
# helst andet.
#
# Der sammenlignes mod posteringens tekst OG modpart, slaaet sammen,
# smaa bogstaver, uden dobbelte mellemrum. Du behoever ikke taenke paa
# store bogstaver eller paa om banken skriver "NETTO 4711" eller
# "Netto Sydhavn".
#
#   tekst:  <liste>   rammer hvis EN af dem findes i teksten, som
#                     understreng. Fint til lange, entydige navne.
#   ord:    <liste>   rammer kun som HELT ord. Brug det altid til
#                     korte ord. `bar` som understreng ramte
#                     "Fiskebar", og `su` rammer Supermarked, Sushi og
#                     SUNSET BOULEVARD - og `su` er en indtaegtsregel,
#                     saa et indkoeb ville vaere bogfoert som penge ind.
#   regex:  <liste>   rammer hvis et af udtrykkene matcher. Brug det
#                     kun naar `tekst` ikke kan: regex er sjovere at
#                     skrive og vaerre at fejlfinde.
#   beloeb_min / beloeb_maks
#                     oere, absolut vaerdi. Giver mening naar samme
#                     modtager daekker to ting - en overfoersel paa
#                     12.000 er husleje, en paa 200 er ikke.
#   retning: ud | ind rammer kun udgifter henholdsvis indtaegter.
#                     Naesten altid det du vil have paa en indtaegts-
#                     regel, saa en tilbagebetaling fra samme butik
#                     ikke lander som et koeb.
#
# AI RORER IKKE DEN HER FIL AUTOMATISK
# Projektets regel 4: ingen model i den deterministiske sti. En
# kategorisering skal kunne forklares med "den ramte linje 23", ikke
# med "modellen mente". Claude maa gerne LAESE de ukategoriserede og
# FORESLAA en linje til dig - men det er dig der skriver den ind.
#
# NAAR NOGET ER FORKERT
# Find posteringen paa /bank, laes teksten, og tilfoej en linje her.
# Det er hele loopet. Der er ikke noget der skal traenes op igen.

