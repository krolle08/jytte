# Install once per clone:  python -m pip install --user pre-commit && pre-commit install
# Run on everything:       pre-commit run --all-files
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]  # deploy/k8s manifests
        exclude: ^deploy/n8n/
      - id: check-json
        exclude: ^(futureUI/|docs/)
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: no-em-dash
        name: no em or en dash (CLAUDE.md writing rule)
        language: pygrep
        entry: "\u2013|\u2014"  # alternation, not a class: pygrep matches bytes
        types: [text]
        exclude: ^(\.ai-scan/|futureUI/|docs/Home monitoring dashboard UI mockups/|docs/home-monitor/tools/|app/widgets/geomap/data/)
